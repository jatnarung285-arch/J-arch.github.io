<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขายของออนไลน์ของฉัน</title>
    <style>
        /* ส่วนนี้คือ CSS ใช้สำหรับตกแต่งให้สวยงาม */
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #f4f4f9; 
            color: #333; 
        }
        
        header { 
            background: linear-gradient(135deg, #FF7043 0%, #E64A19 100%);
            color: white; 
            padding: 2rem; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        header h1 { margin: 0; font-size: 2.5rem; }
        header p { margin: 0.5rem 0 0 0; font-size: 1.1rem; opacity: 0.9; }
        
        .container { 
            display: flex; 
            flex-wrap: wrap; 
            max-width: 1400px; 
            margin: 20px auto; 
            padding: 0 20px; 
            gap: 20px; 
        }
        
        /* โซนสินค้า */
        .products-section { flex: 1; min-width: 300px; }
        .products-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .products-header h2 { margin: 0; }
        .search-box { padding: 10px 15px; border: 2px solid #FF7043; border-radius: 5px; width: 250px; }
        
        .products { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
        }
        
        .product-card { 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            text-align: center; 
            transition: 0.3s; 
            cursor: pointer;
            overflow: hidden;
        }
        
        .product-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        
        .product-card img { 
            max-width: 100%; 
            height: 180px; 
            object-fit: cover; 
            border-radius: 8px; 
            transition: 0.3s;
        }
        
        .product-card:hover img { transform: scale(1.05); }
        
        .product-card h3 { margin: 10px 0 5px 0; font-size: 1.1rem; }
        .product-card p { margin: 5px 0; font-size: 0.9rem; color: #666; }
        
        .price { 
            color: #E64A19; 
            font-weight: bold; 
            font-size: 1.4rem; 
            margin: 10px 0; 
        }
        
        /* ปุ่มกดต่างๆ */
        button { 
            background-color: #FF7043; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 1rem; 
            transition: 0.3s;
            font-weight: 500;
        }
        
        button:hover { 
            background-color: #E64A19; 
            transform: translateY(-2px);
        }
        
        button:active { transform: translateY(0); }
        
        .btn-delete { 
            background-color: #ef5350; 
            width: auto; 
            padding: 5px 10px; 
            margin-left: 10px; 
            font-size: 0.9rem;
        }
        
        .btn-delete:hover { background-color: #c62828; }
        
        .btn-checkout { 
            background-color: #4CAF50; 
            margin-top: 20px; 
            font-size: 1.1rem; 
            padding: 15px; 
        }
        
        .btn-checkout:hover { background-color: #388E3C; }
        
        .btn-clear-cart {
            background-color: #FF9800;
            margin-top: 10px;
            padding: 10px;
            font-size: 0.9rem;
        }
        
        .btn-clear-cart:hover { background-color: #E65100; }

        /* โซนตะกร้าสินค้า */
        .cart { 
            flex: 0 0 350px; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        .cart h2 { margin-top: 0; color: #FF7043; }
        
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            padding-bottom: 12px; 
            border-bottom: 1px solid #eee; 
            font-size: 0.95rem;
        }
        
        .cart-item-name { flex: 1; }
        .cart-item-price { font-weight: bold; color: #E64A19; min-width: 70px; text-align: right; }
        
        .total { 
            font-size: 1.6rem; 
            font-weight: bold; 
            text-align: right; 
            margin-top: 20px; 
            padding-top: 15px;
            border-top: 2px solid #FF7043;
            color: #333; 
        }
        
        .cart-empty { 
            text-align: center; 
            color: #999; 
            padding: 20px 0;
        }
        
        .cart-badge {
            display: inline-block;
            background-color: #E64A19;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            margin-left: 8px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .cart { flex: 0 0 auto; position: static; }
            header h1 { font-size: 1.8rem; }
            .search-box { width: 100%; }
            .products { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
        }
        
        .quantity-control button {
            width: auto;
            padding: 4px 8px;
            font-size: 0.85rem;
        }
        
        .quantity-display {
            min-width: 30px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>🛍️ My Online Store</h1>
    <p>ยินดีต้อนรับสู่ร้านค้าของเรา!</p>
</header>

<div class="container">
    <div class="products-section">
        <div class="products-header">
            <h2>📦 สินค้าทั้งหมด</h2>
            <input type="text" class="search-box" id="search-input" placeholder="ค้นหาสินค้า..." onkeyup="filterProducts()">
        </div>
        <div class="products" id="product-list"></div>
    </div>

    <div class="cart">
        <h2>🛒 ตะกร้าสินค้า <span class="cart-badge" id="cart-count">0</span></h2>
        <div id="cart-items">
            <p class="cart-empty">ยังไม่มีสินค้าในตะกร้า</p>
        </div>
        <div class="total">ยอดรวม: <span id="total-price">0</span> ฿</div>
        <button class="btn-checkout" onclick="checkout()">สั่งซื้อเลย</button>
        <button class="btn-clear-cart" onclick="clearCart()">ล้างตะกร้า</button>
    </div>
</div>

<script>
    /* ส่วนนี้คือ JavaScript ใช้สำหรับทำให้เว็บกดโต้ตอบได้ */
    
    // 1. จำลองฐานข้อมูลสินค้า
    const products = [
        { id: 1, name: "เสื้อยืดสไตล์มินิมอล", price: 250, img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80", category: "เสื้อ" },
        { id: 2, name: "กางเกงยีนส์วินเทจ", price: 590, img: "https://images.unsplash.com/photo-1542272604-780c823d798a?w=400&q=80", category: "กางเกง" },
        { id: 3, name: "รองเท้าผ้าใบ", price: 890, img: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400&q=80", category: "รองเท้า" },
        { id: 4, name: "หมวกแก๊ป", price: 150, img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400&q=80", category: "หมวก" },
        { id: 5, name: "เสื้อแจ็กเก็ตหนัง", price: 1290, img: "https://images.unsplash.com/photo-1551028719-00167b16ebc5?w=400&q=80", category: "เสื้อ" },
        { id: 6, name: "รองเท้าบูท", price: 1490, img: "https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=400&q=80", category: "รองเท้า" }
    ];

    let cart = [];

    // 2. ฟังก์ชันนำสินค้ามาแสดงบนหน้าเว็บ
    function renderProducts(productsToShow = products) {
        const productList = document.getElementById('product-list');
        productList.innerHTML = '';
        
        if (productsToShow.length === 0) {
            productList.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">ไม่พบสินค้าที่ค้นหา</p>';
            return;
        }
        
        productsToShow.forEach(product => {
            const productDiv = document.createElement('div');
            productDiv.className = 'product-card';
            productDiv.innerHTML = `
                <img src="${product.img}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p>${product.category}</p>
                <div class="price">${product.price} ฿</div>
                <button onclick="addToCart(${product.id})">เพิ่มลงตะกร้า</button>
            `;
            productList.appendChild(productDiv);
        });
    }

    // 3. ฟังก์ชันค้นหาสินค้า
    function filterProducts() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        const filtered = products.filter(product => 
            product.name.toLowerCase().includes(searchTerm) ||
            product.category.toLowerCase().includes(searchTerm)
        );
        renderProducts(filtered);
    }

    // 4. ฟังก์ชันเมื่อกดปุ่ม "เพิ่มลงตะกร้า"
    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        const existingItem = cart.find(item => item.id === productId);
        
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({ ...product, quantity: 1 });
        }
        renderCart();
    }

    // 5. ฟังก์ชันอัปเดตหน้าตาตะกร้าสินค้าและคำนวณราคา
    function renderCart() {
        const cartItems = document.getElementById('cart-items');
        const totalPrice = document.getElementById('total-price');
        const cartCount = document.getElementById('cart-count');
        
        cartItems.innerHTML = '';
        let total = 0;
        let itemCount = 0;

        if (cart.length === 0) {
            cartItems.innerHTML = '<p class="cart-empty">ยังไม่มีสินค้าในตะกร้า</p>';
            totalPrice.innerText = '0';
            cartCount.innerText = '0';
        } else {
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                itemCount += item.quantity;
                
                cartItems.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-name">
                            <div>${item.name}</div>
                            <div class="quantity-control">
                                <button onclick="decreaseQuantity(${index})">−</button>
                                <span class="quantity-display">${item.quantity}</span>
                                <button onclick="increaseQuantity(${index})">+</button>
                            </div>
                        </div>
                        <div>
                            <div class="cart-item-price">${itemTotal} ฿</div>
                            <button class="btn-delete" onclick="removeFromCart(${index})">ลบ</button>
                        </div>
                    </div>
                `;
            });
        }
        totalPrice.innerText = total;
        cartCount.innerText = itemCount;
    }

    // 6. ฟังก์ชันเพิ่มจำนวนสินค้า
    function increaseQuantity(index) {
        if (cart[index]) {
            cart[index].quantity += 1;
            renderCart();
        }
    }

    // 7. ฟังก์ชันลดจำนวนสินค้า
    function decreaseQuantity(index) {
        if (cart[index]) {
            if (cart[index].quantity > 1) {
                cart[index].quantity -= 1;
            } else {
                cart.splice(index, 1);
            }
            renderCart();
        }
    }

    // 8. ฟังก์ชันเมื่อกดปุ่มลบสินค้าออกจากตะกร้า
    function removeFromCart(index) {
        cart.splice(index, 1);
        renderCart();
    }

    // 9. ฟังก์ชันล้างตะกร้า
    function clearCart() {
        if (cart.length === 0) {
            alert("ตะกร้าของคุณว่างเปล่าแล้ว");
            return;
        }
        if (confirm("คุณแน่ใจหรือว่าต้องการล้างตะกร้า?")) {
            cart = [];
            renderCart();
        }
    }

    // 10. ฟังก์ชันเมื่อกดปุ่ม "สั่งซื้อเลย"
    function checkout() {
        if (cart.length === 0) {
            alert("กรุณาเลือกสินค้าลงตะกร้าก่อนทำการสั่งซื้อครับ");
            return;
        }
        
        const totalAmount = document.getElementById('total-price').innerText;
        const itemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
        const itemList = cart.map(item => `${item.name} x${item.quantity}`).join('\n');
        
        alert(`ขอบคุณสำหรับการสั่งซื้อ!\n\nรายการสินค้า:\n${itemList}\n\nจำนวน: ${itemCount} รายการ\nยอดชำระทั้งหมด: ${totalAmount} ฿`);
        
        cart = []; // ล้างตะกร้าหลังสั่งซื้อ
        document.getElementById('search-input').value = '';
        renderCart();
        renderProducts();
    }

    // สั่งให้เว็บโหลดสินค้าทันทีที่เปิดหน้าเว็บขึ้นมา
    renderProducts();
</script>

</body>
</html>
